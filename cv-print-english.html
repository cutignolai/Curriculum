<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ignacio Cutignola - Resume</title>
  <meta name="author" content="Ignacio Cutignola">
  <meta name="description" content="Resume of Ignacio Cutignola: firmware and embedded systems, cybersecurity, and software development.">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="cv-print.css">
</head>
<body>
  <main class="cv-page" id="cv-page">
    <header class="cv-top">
      <section class="cv-top-block cv-identity">
        <p class="cv-eyebrow" id="cv-eyebrow">Resume</p>
        <div class="cv-header-row">
          <div class="cv-profile-photo" id="cv-profile-photo"></div>
          <div class="cv-header-copy">
            <div class="cv-name-row">
              <h1 id="cv-name"></h1>
              <div class="cv-name-location" id="cv-location"></div>
            </div>
            <p class="cv-role" id="cv-role"></p>
          </div>
        </div>
        <div class="cv-contact-inline" id="cv-contact"></div>
      </section>
    </header>

    <section class="cv-main">
      <section class="cv-section">
        <h2 class="cv-section-label" id="cv-section-profile">Profile</h2>
        <div class="cv-profile-copy">
          <p id="cv-profile-summary"></p>
        </div>
      </section>

      <section class="cv-section">
        <h2 class="cv-section-label" id="cv-section-experience">Work Experience</h2>
        <div class="cv-timeline" id="cv-experience"></div>
      </section>

      <section class="cv-section">
        <h2 class="cv-section-label" id="cv-section-education">Education</h2>
        <div class="cv-education-list" id="cv-education"></div>
      </section>

      <section class="cv-section">
        <h2 class="cv-section-label" id="cv-section-stack">Technical Skills</h2>
        <div class="cv-skills" id="cv-stack"></div>
      </section>

      <section class="cv-section cv-inline-sections">
        <section>
          <h2 class="cv-section-label" id="cv-section-languages">Languages</h2>
          <ul class="cv-language-list" id="cv-languages"></ul>
        </section>
        <section>
          <h2 class="cv-section-label" id="cv-section-recognition">Honors &amp; Awards</h2>
          <p class="cv-highlight cv-highlight-with-icon">
            <img src="./recurso/Herramientas/logro.png" alt="">
            <span id="cv-recognition-text">ITBA Honors Scholarship</span>
          </p>
        </section>
      </section>

      <section class="cv-section cv-projects-section">
        <h2 class="cv-section-label" id="cv-section-projects">Projects</h2>
        <div class="cv-projects-list" id="cv-projects"></div>
      </section>
    </section>
  </main>

  <script>window.CV_LANGUAGE = "en";</script>
  <script src="profile-data.js"></script>
  <script src="tools-data.js"></script>
  <script src="experiencia-data.js"></script>
  <script src="education-data.js"></script>
  <script src="projects-data.js"></script>
  <script src="cv-print.js"></script>
</body>
</html>
